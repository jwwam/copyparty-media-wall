# Example copyparty config for copyparty-media-wall.
# Replace every /path/to/... and the account line, then run:
#   python3 copyparty-sfx.py -c copyparty.conf
# and open http://<this-machine>:3923/

[global]
  i: 0.0.0.0          # listen on all interfaces; use 127.0.0.1 for this machine only
  p: 3923
  e2dsa               # index all files, so the wall can list the whole library in one request
  e2ts                # read duration / resolution / codec tags (needs ffprobe or mutagen)
  no-hash: .          # index names and sizes only; skips reading every byte of the library
  re-maxage: 300      # pick up files added outside copyparty every 5 minutes
  srch-hits: 200000   # allow large libraries in one search response
  hist: /path/to/data/hist   # keep thumbnails + index out of your media folders

[accounts]
  alice: change-this-password

# the front end itself: "h" serves index.html to everyone (it contains no secrets)
[/]
  /path/to/copyparty-media-wall/web
  accs:
    h: *
  flags:
    d2d

# your media. "r" = read-only, "rwmd" = read, upload, move, delete
[/media]
  /path/to/your/media
  accs:
    rwmd: alice

# several libraries instead of one: mount an empty folder at /media (read-only)
# and each library below it, for example:
#
# [/media]
#   /path/to/data/mediaroot
#   accs:
#     r: alice
# [/media/Movies]
#   /path/to/movies
#   accs:
#     rwmd: alice
# [/media/Photos]
#   /path/to/photos
#   accs:
#     rwmd: alice

# favourites + playback positions, shared between all your devices
[/.wallstate]
  /path/to/data/state
  accs:
    rwd: alice
  flags:
    d2d
