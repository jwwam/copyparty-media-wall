<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>影音库 · 设置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8a3d'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%230b0d12'/%3E%3C/svg%3E">
<style>
:root { --bg: #0b0d12; --panel: #171b24; --panel2: #1f2430; --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.16); --fg: #eef1f6; --fg2: #a9b1c0; --fg3: #6f7888; --acc: #ff8a3d; --accg: linear-gradient(135deg,#ffb347,#ff6a3d 60%,#ff5e62); --ok: #4ade80; --bad: #ff7b7b; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #07080c; color: var(--fg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.aur { position: fixed; inset: -20%; filter: blur(80px); opacity: .55; pointer-events: none; z-index: 0; }
.aur i { position: absolute; border-radius: 50%; }
.aur i:nth-child(1) { width: 44vmax; height: 44vmax; left: 0; top: 0; background: radial-gradient(circle,#ff7a3d 0%,transparent 62%); }
.aur i:nth-child(2) { width: 50vmax; height: 50vmax; right: 0; bottom: -8%; background: radial-gradient(circle,#6a3dff 0%,transparent 62%); }
.wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 34px 20px 80px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accg); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 18px; fill: #14100c; }
header h1 { margin: 0; font-size: 20px; flex: 1; }
header h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--fg2); }
.langb { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line2); background: rgba(255,255,255,.06); color: var(--fg2); font-size: 13px; font-weight: 600; }
.langb:hover { color: var(--fg); border-color: var(--acc); }
.card { background: rgba(23,27,36,.82); border: 1px solid var(--line); border-radius: 20px; padding: 26px; margin-bottom: 16px; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.card h2 { margin: 0 0 6px; font-size: 19px; }
.card > p { margin: 0 0 18px; color: var(--fg2); }
.steps { display: flex; gap: 8px; margin-bottom: 18px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); }
.steps i.on { background: var(--accg); }
label { display: block; margin: 14px 0 6px; color: var(--fg2); font-size: 13px; }
input[type=text], input[type=password] { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(255,255,255,.06); outline: none; font-size: 15px; }
input:focus { border-color: var(--acc); box-shadow: 0 0 0 4px rgba(255,138,61,.18); }
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--fg3); }
.err { min-height: 20px; margin: 10px 0 0; color: var(--bad); font-size: 13px; }
.acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 600; background: rgba(255,255,255,.1); white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.18); }
.btn.acc { background: var(--accg); color: #1a120b; }
.btn.acc:hover { filter: brightness(1.07); }
.btn.sm { height: 34px; padding: 0 13px; border-radius: 9px; font-size: 13px; }
.btn.bad:hover { background: #e5484d; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); }
.row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.row svg, .br button svg { width: 18px; height: 18px; flex: none; fill: rgba(255,138,61,.25); stroke: var(--acc); stroke-width: 1.8; stroke-linejoin: round; }
.x { width: 28px; height: 28px; border-radius: 8px; color: var(--fg3); font-size: 18px; line-height: 1; }
.x:hover { background: #e5484d; color: #fff; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { text-align: left; padding: 16px; border-radius: 14px; border: 1.5px solid var(--line2); background: rgba(255,255,255,.04); }
.opt b { display: block; margin-bottom: 4px; }
.opt small { color: var(--fg2); }
.opt.on { border-color: var(--acc); background: rgba(255,138,61,.12); }
.bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; margin: 14px 0 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accg); transition: width .3s; }
.stat { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--fg3); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 5px rgba(74,222,128,.18); }
.dot.busy { background: var(--acc); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.addr { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); margin-top: 8px; }
.addr small { color: var(--fg3); width: 96px; flex: none; }
.addr code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 14px ui-monospace, Menlo, monospace; color: #ffd9a6; }
.kv { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kv .sp { flex: 1; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.07); }
.seg button { height: 32px; padding: 0 14px; border-radius: 9px; font-size: 13px; color: var(--fg2); }
.seg button.on { background: rgba(255,255,255,.18); color: var(--fg); }
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(4,5,8,.66); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.mbox { width: min(560px,100%); max-height: 86vh; display: flex; flex-direction: column; padding: 22px; border-radius: 20px; background: #1a1e28; border: 1px solid var(--line2); box-shadow: 0 40px 100px rgba(0,0,0,.65); }
.mbox h3 { margin: 0 0 12px; font-size: 18px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.quick button { height: 30px; padding: 0 11px; border-radius: 15px; background: rgba(255,255,255,.07); border: 1px solid var(--line); font-size: 12.5px; color: var(--fg2); }
.quick button:hover { color: var(--fg); border-color: var(--acc); }
.path { padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.3); font: 13px ui-monospace, Menlo, monospace; color: #ffd9a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
.br { flex: 1; min-height: 160px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: rgba(0,0,0,.2); }
.br button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; text-align: left; }
.br button:hover { background: rgba(255,255,255,.08); }
.br p { margin: 14px 10px; color: var(--fg3); font-size: 13px; }
.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 20; padding: 10px 18px; border-radius: 14px; background: rgba(30,34,46,.97); border: 1px solid var(--line2); font-size: 13px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } .card { padding: 20px; } }
@media (min-width: 1800px) { .wrap { zoom: 1.3; } .mbox { zoom: 1.25; } }
</style>
</head>
<body>
<div class="aur"><i></i><i></i></div>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.500z"/></svg></div>
    <h1><span id="ttl"></span><small id="sub"></small></h1>
    <button class="langb" id="lang"></button>
  </header>
  <div id="root"></div>
</div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let lang = localStorage.getItem('wall.setup.lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const L = (zh, en) => lang === 'zh' ? zh : en;
const FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.500h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const QUICK = { home: ['主目录', 'Home'], movies: ['影片', 'Movies'], downloads: ['下载', 'Downloads'], desktop: ['桌面', 'Desktop'], documents: ['文稿', 'Documents'], pictures: ['图片', 'Pictures'], music: ['音乐', 'Music'], disks: ['外接磁盘', 'External disks'] };

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: Object.assign({ 'X-Wall': '1' }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch (e) { /* not json */ }
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { code: j.error || '' });
  return j;
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

let st = null, step = 1, draft = null, dirty = false, pollT = 0;
const root = $('#root');

function head() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = L('影音库 · 设置', 'Media Wall · Setup');
  $('#ttl').textContent = L('影音库', 'Media Wall');
  $('#sub').textContent = st && st.configured ? L('服务管理（只能在这台电脑上打开）', 'Service control (only opens on this computer)') : L('首次设置，大约一分钟', 'First-time setup, about a minute');
  $('#lang').textContent = lang === 'zh' ? 'EN' : '中文';
}
$('#lang').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('wall.setup.lang', lang); render(); });

/* ---------- folder browser ---------- */
function browse() {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox"><h3>${L('选择文件夹', 'Choose a folder')}</h3><div class="quick"></div><div class="path"></div><div class="br"></div>
      <div class="acts"><button class="btn" data-a="cancel">${L('取消', 'Cancel')}</button><button class="btn acc" data-a="ok">${L('选择这个文件夹', 'Use this folder')}</button></div></div>`;
    document.body.appendChild(m);
    let cur = '';
    const load = async p => {
      let j; try { j = await api('/api/ls?path=' + encodeURIComponent(p || '')); } catch (e) { return; }
      cur = j.path;
      $('.path', m).textContent = j.path;
      $('.quick', m).innerHTML = j.quick.map(q => `<button data-p="${esc(q.p)}">${q.n ? esc(q.n) : L(...(QUICK[q.k] || [q.k, q.k]))}</button>`).join('');
      $('.br', m).innerHTML = (j.parent ? `<button data-p="${esc(j.parent)}">${FOLDER}<span>.. ${L('上一级', 'Up')}</span></button>` : '') +
        (j.error === 'denied' ? `<p>${L('没有权限读取这个文件夹。如果系统弹出了授权窗口，请点「允许」后再试。', 'No permission to read this folder. If the system asked for access, allow it and try again.')}</p>`
          : j.dirs.length ? j.dirs.map(d => `<button data-p="${esc(d.p)}">${FOLDER}<span>${esc(d.n)}</span></button>`).join('')
          : `<p>${L('这里没有子文件夹', 'No subfolders here')}</p>`);
    };
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (b) return load(b.dataset.p);
      const a = e.target.closest('[data-a]');
      if (a || e.target === m) { m.remove(); res(a && a.dataset.a === 'ok' ? cur : null); }
    });
    load('');
  });
}
const folderList = fl => fl.length ? `<div class="list">${fl.map((p, i) => `<div class="row">${FOLDER}<span title="${esc(p)}">&lrm;${esc(p)}</span><button class="x" data-rm="${i}" title="${L('移除（不会删除文件）', 'Remove (files are not deleted)')}">×</button></div>`).join('')}</div>` : `<p class="hint">${L('还没有添加文件夹', 'No folders added yet')}</p>`;
const permOpts = p => `<div class="opts">
  <button class="opt${p === 'r' ? ' on' : ''}" data-perm="r"><b>${L('只读', 'Read-only')}</b><small>${L('其他设备只能观看和下载', 'Other devices can only watch and download')}</small></button>
  <button class="opt${p === 'rwmd' ? ' on' : ''}" data-perm="rwmd"><b>${L('可上传和删除', 'Read and write')}</b><small>${L('其他设备还能上传、改名、移动、删除', 'Other devices can also upload, rename, move and delete')}</small></button></div>`;
function checkAccount(d, needPw) {
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(d.user)) return L('用户名只能包含字母、数字、- 和 _', 'The username may only contain letters, digits, - and _');
  if (!needPw && !d.password) return '';
  if (d.password.length < 8 || /\s/.test(d.password)) return L('密码至少 8 位，且不能包含空格', 'The password needs at least 8 characters and no spaces');
  if (d.password !== d.password2) return L('两次输入的密码不一致', 'The two passwords do not match');
  return '';
}
const ffText = j => j.state === 'busy' ? L('正在下载… ', 'Downloading… ') + j.pct + '%' : j.state === 'error' ? L('下载失败，可以稍后在管理页面再试。', 'Download failed; you can retry later from this page.') : '';

/* ---------- first-run wizard ---------- */
function wizard() {
  if (!draft) draft = { user: st.user || '', password: '', password2: '', folders: st.folders.slice(), perm: st.perm || 'r' };
  const needFF = !!st.ffmpeg_dl && !st.ffmpeg, total = needFF ? 4 : 3;
  const bars = `<div class="steps">${Array.from({ length: total }, (_, i) => `<i class="${i < step ? 'on' : ''}"></i>`).join('')}</div>`;
  let h = '';
  if (step === 1) h = `<h2>${L('1. 设置登录账号', '1. Create the login')}</h2><p>${L('其他设备访问影音库时要输入这个密码。', 'Other devices enter this password to open the library.')}</p>
    <label>${L('用户名', 'Username')}</label><input type="text" id="u" value="${esc(draft.user)}" autocomplete="username" spellcheck="false">
    <label>${L('密码（至少 8 位）', 'Password (at least 8 characters)')}</label><input type="password" id="p1" value="${esc(draft.password)}" autocomplete="new-password">
    <label>${L('再输入一次密码', 'Repeat the password')}</label><input type="password" id="p2" value="${esc(draft.password2)}" autocomplete="new-password">
    <p class="hint">${L('密码保存在这台电脑上，不要使用和银行、邮箱相同的密码。', 'The password is stored on this computer; do not reuse a banking or email password.')}</p>`;
  else if (step === 2) h = `<h2>${L('2. 选择媒体文件夹', '2. Choose your media folders')}</h2><p>${L('影音库会扫描这些文件夹里的视频、图片、音乐和其他文件。文件留在原处，不会被移动。', 'The wall scans these folders for videos, images, music and other files. Files stay where they are.')}</p>
    ${folderList(draft.folders)}<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn sm" data-a="add">＋ ${L('添加文件夹', 'Add a folder')}</button></div>`;
  else if (step === 3) h = `<h2>${L('3. 其他设备能做什么', '3. What other devices may do')}</h2><p>${L('之后可以随时在这个页面修改。', 'You can change this later on this page.')}</p>${permOpts(draft.perm)}`;
  else h = `<h2>${L('4. 视频封面（可选）', '4. Video covers (optional)')}</h2><p>${L('要显示视频和音乐的封面图，需要 FFmpeg 组件（约 ' + st.ffmpeg_dl.mb + ' MB，只需下载一次）。它来自第三方构建 ' + st.ffmpeg_dl.src + '，因为 FFmpeg 官方只发布源代码，不提供现成程序。', 'Covers for videos and music need FFmpeg (about ' + st.ffmpeg_dl.mb + ' MB, downloaded once). It comes from the third-party build at ' + st.ffmpeg_dl.src + ', because the FFmpeg project itself only publishes source code.')}</p>
    <div class="bar"><i style="width:${st.ffmpeg ? 100 : st.ffmpeg_job.pct}%"></i></div><p class="hint" id="ffm">${st.ffmpeg ? L('已安装', 'Installed') : ffText(st.ffmpeg_job)}</p>`;
  const ffBusy = st.ffmpeg_job.state === 'busy';
  root.innerHTML = `<div class="card">${bars}${h}<div class="err" id="err"></div><div class="acts">
    ${step > 1 ? `<button class="btn" data-a="back">${L('上一步', 'Back')}</button>` : ''}
    ${step === 4 && !st.ffmpeg ? `<button class="btn" data-a="finish"${ffBusy ? ' disabled' : ''}>${L('跳过', 'Skip')}</button><button class="btn acc" data-a="ff"${ffBusy ? ' disabled' : ''}>${L('下载', 'Download')}</button>`
      : `<button class="btn acc" data-a="${step === total || (step === 4) ? 'finish' : 'next'}">${step === total || step === 4 ? L('完成并启动', 'Finish and start') : L('下一步', 'Next')}</button>`}
  </div></div>`;
  const u = $('#u'); if (u && !u.value) u.focus();
}
function keep() { const u = $('#u'); if (u && draft) { draft.user = u.value.trim(); draft.password = $('#p1').value; draft.password2 = $('#p2').value; } }

/* ---------- dashboard ---------- */
function dash() {
  if (!draft) draft = { user: st.user, password: '', password2: '', folders: st.folders.slice(), perm: st.perm };
  const busy = st.start_job.state === 'busy', sj = st.start_job;
  const stat = busy ? [L(sj.msg === 'pillow' ? '正在安装缩略图组件（首次需要约 10 秒）…' : '正在启动…', sj.msg === 'pillow' ? 'Installing the thumbnail component (about 10 seconds the first time)…' : 'Starting…'), 'busy']
    : st.running ? [L('影音库正在运行', 'The library is running'), 'on'] : [L('服务已停止', 'The service is stopped'), ''];
  root.innerHTML = `<div class="card">
      <div class="kv"><div class="stat"><i class="dot ${stat[1]}"></i>${stat[0]}</div><div class="sp"></div>
        ${st.running ? `<button class="btn sm" data-a="restart"${busy ? ' disabled' : ''}>${L('重启', 'Restart')}</button><button class="btn sm bad" data-a="stop"${busy ? ' disabled' : ''}>${L('停止', 'Stop')}</button>` : `<button class="btn sm acc" data-a="start"${busy ? ' disabled' : ''}>${L('启动', 'Start')}</button>`}</div>
      ${sj.state === 'error' ? `<div class="err">${L('启动失败，请查看日志 ', 'Could not start; see the log at ')}${esc(st.log)}</div>` : ''}
      ${st.running ? `<div class="acts" style="justify-content:flex-start"><a class="btn acc" href="${esc(st.local)}" target="_blank" rel="noopener">▶ ${L('打开影音库', 'Open the library')}</a></div>
        <div class="addr"><small>${L('这台电脑', 'This computer')}</small><code>${esc(st.local)}</code><button class="btn sm" data-copy="${esc(st.local)}">${L('复制', 'Copy')}</button></div>
        ${st.lan ? `<div class="addr"><small>${L('其他设备', 'Other devices')}</small><code>${esc(st.lan)}</code><button class="btn sm" data-copy="${esc(st.lan)}">${L('复制', 'Copy')}</button></div><p class="hint">${L('同一个 Wi-Fi 或局域网里的手机、平板、电脑，用浏览器打开「其他设备」的地址，输入密码即可。', 'Phones, tablets and computers on the same Wi-Fi or LAN open the "other devices" address in a browser and enter the password.')}</p>`
          : `<p class="hint">${L('没有检测到局域网地址，这台电脑可能没有联网。', 'No LAN address found; this computer may be offline.')}</p>`}` : ''}
    </div>
    <div class="card"><h2>${L('媒体文件夹', 'Media folders')}</h2><p>${L('影音库扫描这些文件夹。移除只是不再共享，不会删除文件。', 'The wall scans these folders. Removing one only stops sharing it; nothing is deleted.')}</p>
      ${folderList(draft.folders)}<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn sm" data-a="add">＋ ${L('添加文件夹', 'Add a folder')}</button></div></div>
    <div class="card"><h2>${L('其他设备的权限', 'What other devices may do')}</h2><p></p>${permOpts(draft.perm)}</div>
    <div class="card"><h2>${L('登录账号', 'Login')}</h2><p>${L('不改密码就把密码两栏留空。', 'Leave both password fields empty to keep the current password.')}</p>
      <label>${L('用户名', 'Username')}</label><input type="text" id="u" value="${esc(draft.user)}" spellcheck="false" autocomplete="username">
      <label>${L('新密码', 'New password')}</label><input type="password" id="p1" value="${esc(draft.password)}" autocomplete="new-password">
      <label>${L('再输入一次新密码', 'Repeat the new password')}</label><input type="password" id="p2" value="${esc(draft.password2)}" autocomplete="new-password"></div>
    ${st.ffmpeg_dl || st.ffmpeg ? `<div class="card"><h2>${L('视频封面组件（FFmpeg）', 'Video covers (FFmpeg)')}</h2>
      ${st.ffmpeg ? `<p style="margin:0;color:var(--ok)">✓ ${L('已安装', 'Installed')}</p>` : `<p>${L('没有它，视频和音乐只显示文字色块。下载约 ' + st.ffmpeg_dl.mb + ' MB，来自第三方构建 ' + st.ffmpeg_dl.src + '。', 'Without it videos and music show a plain tile. About ' + st.ffmpeg_dl.mb + ' MB, from the third-party build at ' + st.ffmpeg_dl.src + '.')}</p>
        <div class="bar"><i style="width:${st.ffmpeg_job.pct}%"></i></div><p class="hint">${ffText(st.ffmpeg_job)}</p>
        <div class="acts" style="justify-content:flex-start"><button class="btn sm acc" data-a="ff"${st.ffmpeg_job.state === 'busy' ? ' disabled' : ''}>${L('下载', 'Download')}</button></div>`}</div>` : ''}
    <div class="card" id="savebar"${dirty ? '' : ' hidden'}><div class="kv"><b>${L('有未保存的修改', 'You have unsaved changes')}</b><div class="sp"></div><button class="btn" data-a="revert">${L('放弃', 'Discard')}</button><button class="btn acc" data-a="apply">${L('保存并重启服务', 'Save and restart')}</button></div><div class="err" id="err"></div></div>`;
}

function render() { if (!st) return; head(); if (st.configured && !window.__wiz) dash(); else wizard(); }
async function refresh(soft) {
  try { st = await api('/api/status'); } catch (e) { root.innerHTML = `<div class="card"><h2>${L('连接不上管理程序', 'Cannot reach the helper')}</h2><p>${L('请重新打开影音库应用。', 'Start the Media Wall app again.')}</p></div>`; return; }
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (!(soft && typing) && !$('.modal')) { keep(); render(); }
  clearTimeout(pollT);
  if (st.start_job.state === 'busy' || st.ffmpeg_job.state === 'busy') pollT = setTimeout(() => refresh(true), 1200);
}
async function saveAndStart() {
  keep();
  const e1 = checkAccount(draft, !st.user); if (e1) { if (!st.configured || window.__wiz) step = 1; render(); $('#err').textContent = e1; return; }
  if (!draft.folders.length) { if (!st.configured || window.__wiz) step = 2; render(); $('#err').textContent = L('请至少添加一个文件夹', 'Add at least one folder'); return; }
  try {
    await api('/api/save', { user: draft.user, password: draft.password, folders: draft.folders, perm: draft.perm });
    await api('/api/start', {});
    window.__wiz = false; draft = null; dirty = false; step = 1;
    await refresh();
  } catch (e) { render(); const el = $('#err'); if (el) el.textContent = L('保存失败：', 'Could not save: ') + (e.code || e.message); }
}
root.addEventListener('input', () => { if (st && st.configured && !window.__wiz) { dirty = true; const b = $('#savebar'); if (b) b.hidden = false; } });
root.addEventListener('click', async e => {
  const rm = e.target.closest('[data-rm]'); if (rm) { keep(); draft.folders.splice(+rm.dataset.rm, 1); dirty = true; return render(); }
  const pm = e.target.closest('[data-perm]'); if (pm) { keep(); draft.perm = pm.dataset.perm; dirty = true; return render(); }
  const cp = e.target.closest('[data-copy]');
  if (cp) { const t = cp.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(L('已复制', 'Copied')), () => toast(t)); return; }
  const a = e.target.closest('[data-a]'); if (!a || a.disabled) return;
  const act = a.dataset.a; keep();
  if (act === 'add') { const p = await browse(); if (p && !draft.folders.includes(p)) { draft.folders.push(p); dirty = true; } return render(); }
  if (act === 'back') { step--; return render(); }
  if (act === 'next') {
    const er = step === 1 ? checkAccount(draft, !st.user) : step === 2 && !draft.folders.length ? L('请至少添加一个文件夹', 'Add at least one folder') : '';
    if (er) { $('#err').textContent = er; return; }
    step++; return render();
  }
  if (act === 'finish' || act === 'apply') return saveAndStart();
  if (act === 'revert') { draft = null; dirty = false; return render(); }
  if (act === 'ff') { await api('/api/ffmpeg', {}); return refresh(); }
  if (act === 'start' || act === 'restart') { await api('/api/start', {}); return refresh(); }
  if (act === 'stop') { await api('/api/stop', {}); return refresh(); }
});
refresh();
setInterval(() => { if (!document.hidden && st && st.start_job.state !== 'busy' && st.ffmpeg_job.state !== 'busy') refresh(true); }, 6000);
})();
</script>
</body>
</html>
